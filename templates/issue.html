{% extends "base.html" %}
{% block title %}Issue Book{% endblock %}

{% block content %}
{% call form_page('Issue a book', 'Lend a copy to a member.', image='issue.png', bleed=True) %}
<form method="POST" action="{{ url_for('issue') }}" class="needs-validation" novalidate>
  <div class="field">
    <label class="form-label" for="memberCode">Member code <span class="req" aria-hidden="true">*</span></label>
    <input type="text" id="memberCode" name="member_code" class="form-control form-control-lg mono uc"
           placeholder="e.g. U001" required autofocus autocomplete="off" maxlength="20" data-prefill="member">
    <div class="invalid-feedback">Enter the member's code, printed on their library card.</div>
  </div>

  <div class="field">
    <label class="form-label" for="isbn">Book ISBN <span class="req" aria-hidden="true">*</span></label>
    <input type="text" id="isbn" name="isbn" class="form-control form-control-lg mono"
           placeholder="e.g. 978-0-13-468599-1" required autocomplete="off" maxlength="32" data-prefill="isbn">
    <div class="invalid-feedback">Enter the ISBN from the book.</div>
  </div>

  <button type="submit" class="btn btn-lis-primary btn-lg w-100 mt-4">Issue book</button>
</form>
{% endcall %}
{% endblock %}
