{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="panel mt-4 mx-auto" style="max-width: 560px">
  <div class="empty">
    <p class="mono mb-2">Error 404</p>
    <h2>This page doesn't exist</h2>
    <p>The address may be mistyped, or the page may have moved.</p>
    <a href="{{ url_for('search') if session_role else url_for('login') }}" class="btn btn-lis-primary">{{ 'Back to the catalogue' if session_role else 'Go to sign in' }}</a>
  </div>
</div>
{% endblock %}
